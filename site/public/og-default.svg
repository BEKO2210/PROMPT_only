<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070710"/>
      <stop offset="1" stop-color="#0b0b16"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="20%" r="50%">
      <stop offset="0" stop-color="#00b3f0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00b3f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="80%" r="50%">
      <stop offset="0" stop-color="#ff9d1c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9d1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b3f0"/>
      <stop offset="1" stop-color="#58dfff"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b3f0"/>
      <stop offset="0.5" stop-color="#58dfff"/>
      <stop offset="1" stop-color="#c9f5ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- BA Monogram tile -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="url(#accent)"/>
    <rect x="0" y="0" width="120" height="120" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="60" y="86" font-family="Inter Tight, Inter, system-ui, sans-serif"
          font-size="64" font-weight="800" fill="#070710"
          text-anchor="middle" letter-spacing="-3">BA</text>
  </g>

  <!-- Wordmark next to monogram -->
  <g transform="translate(232,200)">
    <text x="0" y="0" font-family="Inter Tight, Inter, system-ui, sans-serif"
          font-size="38" font-weight="600" fill="#e6e6f0">Belkis Aslani</text>
    <text x="0" y="32" font-family="JetBrains Mono, monospace"
          font-size="14" font-weight="500" fill="#8a8aa8"
          letter-spacing="3">SOFTWARE COMPLIANCE &amp; AUDIT</text>
  </g>

  <!-- Display headline -->
  <g transform="translate(80,360)">
    <text x="0" y="0" font-family="Inter Tight, Inter, system-ui, sans-serif"
          font-size="76" font-weight="700" fill="#f6f6fb" letter-spacing="-3">
      Senior Consulting,
    </text>
    <text x="0" y="80" font-family="Inter Tight, Inter, system-ui, sans-serif"
          font-size="76" font-weight="700" fill="url(#textGradient)" letter-spacing="-3">
      in Tagen geliefert.
    </text>
  </g>

  <!-- Bottom strip with stats -->
  <g transform="translate(80,550)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace"
          font-size="18" font-weight="500" fill="#bcbcd0" letter-spacing="1">
      78 Prompts · 10 Samples · AI Act · DSGVO · DORA · ISO 27001
    </text>
  </g>

  <!-- Top-right ribbon "PROMPT_only library" -->
  <g transform="translate(1010,80)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(0,179,240,0.12)" stroke="rgba(0,179,240,0.4)" stroke-width="1"/>
    <text x="60" y="21" font-family="JetBrains Mono, monospace"
          font-size="11" font-weight="600" fill="#58dfff"
          text-anchor="middle" letter-spacing="2">OPEN SOURCE</text>
  </g>
</svg>
