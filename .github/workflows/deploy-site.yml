name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/create-claude-prompt-KGaAX
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment, skip queued runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect whether site/package-lock.json exists. setup-node@v4's
      # built-in `cache: 'npm'` errors if the lockfile path doesn't
      # resolve, so we gate caching on actual presence.
      - name: Detect lockfile
        id: lockfile
        run: |
          if [ -f site/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile present — will use npm ci with cache."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No lockfile — will use npm install without cache."
          fi

      # Two variants of setup-node; only one runs per job.
      - name: Setup Node.js (with cache)
        if: steps.lockfile.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Setup Node.js (no cache)
        if: steps.lockfile.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./site
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check
        working-directory: ./site
        run: npm run check
        continue-on-error: true   # warn but don't block while phases settle

      - name: Build
        working-directory: ./site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse CI (informational)
    needs: deploy
    runs-on: ubuntu-latest
    if: false   # enable once site has real content (Phase 7)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --collect.url=${{ needs.deploy.outputs.page_url }}
        continue-on-error: true
